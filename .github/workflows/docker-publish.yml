name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-server.txt

      - name: Run tests
        env:
          SANDBOX_REQUIRE_ISOLATION: "0"
        run: PYTHONPATH=src python -m unittest tests.test_api -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: zero
            python_version: "3.14"
            platforms: linux/amd64,linux/arm64
          - flavor: small
            python_version: "3.14"
            platforms: linux/amd64,linux/arm64
          - flavor: gpt
            python_version: "3.14"
            platforms: linux/amd64
    # gpt image is large; only build it on main / tags.
    if: github.event_name != 'pull_request' || matrix.flavor != 'gpt'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.flavor }}
            type=raw,value=latest,enable=${{ matrix.flavor == 'small' && github.event_name != 'pull_request' }}
            type=sha,prefix=${{ matrix.flavor }}-sha-
            type=semver,pattern={{version}},prefix=${{ matrix.flavor }}-
            type=semver,pattern={{version}},enable=${{ matrix.flavor == 'small' }}
            type=ref,event=pr,prefix=${{ matrix.flavor }}-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLAVOR=${{ matrix.flavor }}
            PYTHON_VERSION=${{ matrix.python_version }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
